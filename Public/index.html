<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YouTube Clipper V1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b0d10;color:#f5f5f5}
.wrap{max-width:560px;margin:auto;padding:20px 16px 40px}.brand{font-size:24px;font-weight:800;margin:10px 0 6px}
.sub{color:#9ca3af;font-size:14px;margin-bottom:20px}.card{background:#151922;border:1px solid #262b36;border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:#aeb5c1;margin:12px 0 6px}
input,select,button{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px}
input,select{background:#0e1117;color:#fff;border:1px solid #303644}
button{background:#fff;color:#111;font-weight:750;margin-top:12px;cursor:pointer}
button:disabled{opacity:.45}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumb{width:100%;border-radius:12px;display:none;margin-top:12px}.meta{display:none}.title{font-weight:750;margin-top:10px}
.range{width:100%}.time{display:flex;justify-content:space-between;color:#9ca3af;font-size:13px}
.status{font-size:13px;color:#cbd5e1;margin-top:10px;min-height:20px}.download{display:none;text-align:center;text-decoration:none;background:#22c55e;color:#07130a;padding:13px;border-radius:12px;font-weight:800;margin-top:12px}
.notice{font-size:12px;line-height:1.5;color:#8f98a8}.pill{display:inline-block;background:#202633;border-radius:999px;padding:5px 9px;font-size:11px;color:#bfc7d4}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">✂️ YouTube Clipper</div>
  <div class="sub">V1 • mobile-first • 9:16</div>

  <div class="card">
    <label>URL YouTube</label>
    <input id="url" placeholder="https://youtube.com/watch?v=..." autocomplete="off">
    <button id="analyze">Analisis Video</button>
    <div id="status" class="status"></div>
    <img id="thumb" class="thumb">
    <div id="meta" class="meta">
      <div id="title" class="title"></div>
      <div id="channel" class="notice"></div>
      <div style="margin-top:8px"><span class="pill">Durasi: <b id="duration">0:00</b></span></div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div><label>Mulai (detik)</label><input id="start" type="number" min="0" value="0"></div>
      <div><label>Selesai (detik)</label><input id="end" type="number" min="1" value="30"></div>
    </div>
    <label>Posisi crop</label>
    <select id="crop">
      <option value="center">Tengah</option>
      <option value="left">Kiri</option>
      <option value="right">Kanan</option>
    </select>
    <button id="make">🎬 Buat Clip 9:16</button>
    <div id="clipStatus" class="status"></div>
    <a id="download" class="download" target="_blank">⬇️ Buka / Download MP4</a>
  </div>

  <div class="card notice">
    <b>Catatan:</b> gunakan hanya video yang Anda miliki atau yang Anda punya izin untuk diproses. V1 membatasi clip maksimal 3 menit.
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let videoInfo = null;

function fmt(sec){
  sec = Math.max(0, Math.round(sec||0));
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}
function setStatus(el,msg){el.textContent=msg}

$("analyze").onclick = async () => {
  const url=$("url").value.trim();
  if(!url) return setStatus($("status"),"Masukkan URL YouTube dulu.");
  $("analyze").disabled=true; setStatus($("status"),"Membaca informasi video...");
  try{
    const r=await fetch("/api/info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"Gagal");
    videoInfo=d;
    $("thumb").src=d.thumbnail; $("thumb").style.display=d.thumbnail?"block":"none";
    $("meta").style.display="block"; $("title").textContent=d.title||"";
    $("channel").textContent=d.channel||""; $("duration").textContent=fmt(d.duration);
    $("end").value=Math.min(30,Math.floor(d.duration||30));
    setStatus($("status"),"Video siap. Atur timestamp lalu buat clip.");
  }catch(e){setStatus($("status"),e.message)}
  finally{$("analyze").disabled=false}
};

$("make").onclick = async () => {
  const url=$("url").value.trim(), start=Number($("start").value), end=Number($("end").value);
  if(!videoInfo) return setStatus($("clipStatus"),"Analisis video terlebih dahulu.");
  if(end<=start) return setStatus($("clipStatus"),"Waktu selesai harus lebih besar.");
  if(end-start>180) return setStatus($("clipStatus"),"Maksimal 180 detik.");
  $("make").disabled=true; $("download").style.display="none";
  setStatus($("clipStatus"),"Sedang download & render. Jangan tutup halaman...");
  try{
    const r=await fetch("/api/clip",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url,start,end,crop:$("crop").value})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"Render gagal");
    $("download").href=d.url; $("download").style.display="block";
    setStatus($("clipStatus"),"Selesai. Clip sudah siap.");
  }catch(e){setStatus($("clipStatus"),e.message)}
  finally{$("make").disabled=false}
};
</script>
</body>
</html>
